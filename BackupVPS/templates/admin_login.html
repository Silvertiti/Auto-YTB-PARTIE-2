<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clipo — Connexion Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg:     #06080f;
            --card:   #0f1724;
            --accent: #6366f1;
            --text:   #e2e8f0;
            --muted:  #64748b;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex; align-items: center; justify-content: center; height: 100vh;
        }
        .login-card {
            background: var(--card); border: 1px solid rgba(99,102,241,.15);
            border-radius: 24px; padding: 40px; width: 100%; max-width: 400px;
            text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.3);
        }
        h1 { font-size: 24px; font-weight: 900; margin-bottom: 8px; }
        p { color: var(--muted); font-size: 14px; margin-bottom: 30px; }
        
        .field { text-align: left; margin-bottom: 20px; }
        label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; margin-bottom: 8px; color: var(--muted); }
        input {
            width: 100%; background: rgba(255,255,255,.03); border: 1px solid rgba(99,102,241,.2);
            border-radius: 12px; padding: 14px; color: white; outline: none; transition: border-color .3s;
        }
        input:focus { border-color: var(--accent); }
        
        button {
            width: 100%; background: var(--accent); color: white; border: none;
            padding: 14px; border-radius: 12px; font-weight: 800; cursor: pointer;
            transition: transform .3s;
        }
        button:hover { transform: translateY(-2px); }
        
        .error { color: #f87171; font-size: 13px; margin-top: 16px; display: none; }
        .back-link { display: block; margin-top: 24px; font-size: 13px; color: var(--muted); text-decoration: none; }
        .back-link:hover { color: white; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Clipo Admin</h1>
        <p>Veuillez entrer le mot de passe administrateur</p>
        
        <form id="loginForm">
            <div class="field">
                <label>Mot de passe</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit">Se connecter</button>
            <div id="errorMsg" class="error">Mot de passe incorrect</div>
        </form>
        
        <a href="/" class="back-link">← Retour à l'accueil</a>
    </div>

    <script>
        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            
            try {
                const res = await fetch('/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                
                if (res.ok) {
                    window.location.href = '/admin/dashboard';
                } else {
                    document.getElementById('errorMsg').style.display = 'block';
                }
            } catch(e) {
                alert('Erreur serveur');
            }
        };
    </script>
</body>
</html>
